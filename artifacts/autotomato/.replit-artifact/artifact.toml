kind = "mobile"
previewPath = "/"
title = "auTOMATO"
version = "1.0.0"
id = "artifacts/autotomato"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25738

[services.development]
run = "pnpm --filter @workspace/autotomato run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autotomato", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/autotomato", "run", "serve" ]

[services.env]
PORT = "25738"
BASE_PATH = "/"
